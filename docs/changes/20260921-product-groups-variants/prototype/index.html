<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品组与款式原型</title>
<style>body{font:15px system-ui;max-width:430px;margin:auto;background:#f5f7fb;color:#172033;padding:16px 16px 92px}section{background:#fff;border-radius:10px;padding:16px;margin-bottom:12px}label{display:block;margin:10px 0}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd4e2;border-radius:8px}button{min-height:44px;padding:0 16px;border:0;border-radius:8px;background:#3657c8;color:#fff}.secondary{background:#fff;border:1px solid #3657c8;color:#3657c8}.variant{display:grid;grid-template-columns:1fr;gap:8px}.variant input{width:auto}.variant-list{display:grid;gap:12px}.muted{color:#71809a;font-size:12px}.actions{position:fixed;right:0;bottom:0;left:0;display:grid;grid-template-columns:1fr 1.25fr;gap:8px;max-width:430px;margin:auto;padding:12px 16px;background:#fff;border-top:1px solid #dfe5ee}</style>
<main data-ai-id="product-group-prototype"><h1>新建商品组</h1><section data-ai-id="product-group-common"><label>商品组名称<input value="专辑 A 小卡"></label><label>描述<textarea>不同成员封面</textarea></label></section><section data-ai-id="product-group-variants"><h2>款式（可选）</h2><p class="muted">不添加款式时，商品按单一商品采购、上架和销售；款式数量和单价在批次采购时填写。</p><p><button class="secondary" data-ai-id="product-group-template-generate">快捷生成商品组</button></p><div class="variant-list"><div class="variant"><input value="樱"></div><div class="variant"><input value="采"></div><div class="variant"><input value="允"></div></div><p><button data-ai-id="product-group-add-variant">+ 添加款式</button></p></section><section data-ai-id="product-group-next-step"><h2>去上架会先采购</h2><p>选择“保存并去上架”后，先选择批次并进入该批次的新增采购页；采购完成后继续填写渠道、链接和展示价。</p></section></main><footer class="actions" data-ai-id="product-group-actions"><button class="secondary" data-ai-id="product-group-save">保存并返回主页</button><button data-ai-id="product-group-list-and-purchase">保存并去上架</button></footer>
