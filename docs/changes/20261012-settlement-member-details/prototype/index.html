<style>

th:100%;border:0;border-bottom:1px solid var(--line);background:#fff;color:#172033;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;min-height:54px}.member-trigger:last-child{border-bottom:0}.member-trigger span:first-child{min-width:0;overflow-wrap:anywhere}.row strong,.member-trigger b{white-space:nowrap}.amount-tail{display:flex;gap:12px;align-items:center}.arrow{color:#8993a7}.percent{display:flex;align-items:center;gap:5px}.percent input{width:72px;height:38px;text-align:right;border:1px solid #cfd6e2;border-radius:8px;padding:8px;color:#172033}.summary-grid{display:grid;grid-template-columns:1fr 1fr}.summary-grid>div{padding:12px;border-bottom:1px solid var(--line)}.summary-grid small,.summary-grid strong{display:block}.summary-grid small{color:var(--muted);margin-bottom:5px}.result{padding:12px;border-bottom:1px solid var(--line)}.result:last-child{border:0}.result-heading{display:flex;justify-content:space-between;align-items:start;gap:12px}.result-heading>div{min-width:0}.result-name{display:block;margin-bottom:6px;overflow-wrap:anywhere}.result-heading b{white-space:nowrap;font-size:14px}.receivable{color:#008b59}.payable{color:#c1423b}.detail-trigger{display:flex;align-items:center;gap:8px;min-height:44px;margin-top:10px;padding:0;border:0;background:transparent;color:#536078;font-size:12px}.footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}.primary{border:0;border-radius:6px;background:var(--blue);color:#fff;padding:0 16px}.footer button{width:100%}.notice{padding:12px;border-radius:8px;background:#fff6e9;color:#8c570e;font-size:12px;line-height:1.6}.sheet{position:fixed;inset:auto 0 0;width:min(100%,430px);max-width:430px;height:90dvh;max-height:90dvh;margin:0 auto;padding:0;border:0;border-radius:16px 16px 0 0;background:#f5f7fb;color:#172033;overflow:hidden}.sheet::backdrop{background:rgba(23,32,51,.4)}.sheet-layout{display:flex;flex-direction:column;height:100%}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;min-height:76px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}.sheet-head>div{min-width:0}.sheet-head h2{margin:0 0 4px;overflow-wrap:anywhere}.close{flex:none;min-width:44px;min-height:44px;border:0;border-radius:6px;background:#f2f4f8;color:#536078;font-size:23px}.sheet-body{overflow:auto;overscroll-behavior:contain;padding:14px 16px calc(20px + env(safe-area-inset-bottom));min-height:0;flex:1}.person-summary{padding:14px;border-radius:10px;background:#fff;margin-bottom:12px}.person-summary .big{font-size:22px;line-height:1.5;margin:4px 0}.formula{font-size:12px;line-height:1.8;color:#536078}.formula-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.formula-line strong{white-space:nowrap}.formula-line:last-child{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}.categories>details{margin-bottom:10px;background:#fff;border-radius:10px;overflow:hidden}.categories>details>summary{display:flex;list-style:none;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:12px;cursor:pointer}.categories>details>summary::-webkit-details-marker,.source>summary::-webkit-details-marker{display:none}.category-title{display:flex;gap:8px;align-items:center}.chevron{display:inline-block;color:#8993a7;font-size:12px}.categories>details[open] .chevron{transform:rotate(90deg)}.category-content{border-top:1px solid var(--line);padding:0 12px}.category-note{font-size:12px;line-height:1.65;color:var(--muted);padding:12px 0;border-bottom:1px solid var(--line)}.transaction{padding:14px 0;border-bottom:1px solid var(--line)}.transaction:last-child{border:0}.item-title{font-size:14px;line-height:1.6;font-weight:600;overflow-wrap:anywhere}.tag{display:inline-block;vertical-align:middle;font-size:10px;font-weight:400;line-height:16px;border:1px solid #cfd8f8;border-radius:3px;padding:0 4px;color:var(--blue);margin-right:6px}.item-meta{margin:5px 0 8px;font-size:12px;color:var(--muted);line-height:1.6}.detail-line{display:flex;justify-content:space-between;gap:12px;margin-top:6px;line-height:1.6;font-size:12px;color:#536078}.detail-line b{white-space:nowrap;color:#172033}.detail-line.emphasis b{color:var(--blue)}.source{margin-top:8px}.source>summary{list-style:none;display:flex;align-items:center;min-height:44px;color:var(--blue);font-size:12px;cursor:pointer}.source-box{padding:10px;background:#f5f7fb;border-radius:8px;font-size:12px;line-height:1.7}.source-box h3{font-size:12px;margin:8px 0 4px}.source-box h3:first-child{margin-top:0}.source-box p{color:#536078}.source-box .detail-line{font-size:12px}.source-box .muted{margin-top:8px}.inventory-link{display:flex;align-items:center;color:var(--blue);min-height:44px;text-decoration:none}.source-item{padding:8px 0;border-bottom:1px solid var(--line)}.source-item:last-child{border:0}.empty{padding:30px 12px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}.state{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}.spinner{width:24px;height:24px;border:2px solid #dbe1ee;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.origin-reference{padding:12px;background:#fff;border:1px solid var(--line);border-radius:8px;margin-top:12px}.review-status{font-size:12px;color:var(--muted);margin:12px 0;line-height:1.6}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>

<body>
<div class="app" data-ai-id="settlement-create-page">
<div class="tools" data-ai-id="prototype-controls"><p>交互原型 · 固定示例数据，不连接业务接口</p><div class="tool-row"><button type="button" data-ai-id="prototype-step-cost" aria-pressed="true" onclick="setStep(2)">第 2 步 · 成本</button><button type="button" data-ai-id="prototype-step-preview" aria-pressed="false" onclick="setStep(3)">第 3 步 · 预览</button></div><label class="scenario">查看情景<select data-ai-id="prototype-scenario" onchange="setScenario(this.value)"><option value="normal">正常明细</option><option value="loading">加载中</option><option value="error">加载失败</option><option value="empty">暂无明细</option><option value="long">长列表</option><option value="long-name">长姓名与商品名</option><option value="mismatch">金额不一致</option><option value="missing">缺失分摊记录</option></select></label></div>
<header class="topbar"><strong>创建账单</strong></header><main class="content"><div class="steps"><span>1 选择</span><span id="step-2" class="active">2 利润</span><span id="step-3">3 预览</span></div><div id="main"></div><p class="review-status" data-ai-id="prototype-review-note">点击人员承担成本或“查看计算明细”，体验弹窗。所有金额均为演示数据。</p></main><footer class="footer"><button type="button" class="primary" data-ai-id="settlement-next" onclick="nextStep()">下一步</button></footer></div>
<dialog class="sheet" id="member-dialog" aria-labelledby="popup-title" data-ai-id="settlement-member-details-popup"><div class="sheet-layout"><header class="sheet-head"><div><h2 id="popup-title">个人明细</h2><p class="muted" id="popup-subtitle"></p></div><button type="button" class="close" aria-label="关闭个人明细" data-ai-id="settlement-member-details-close" onclick="closeDetails()">×</button></header><div class="sheet-body" id="popup-body" data-ai-id="settlement-member-details-body"></div></div></dialog>
<script>
'use strict';
const memberIds=['00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000002'];
const members=[{id:memberIds[0],name:'follow',cost:'520.00',paid:'995.07',expense:'52.25',received:'349.22',profit:'166.26',net:'389.29',direction:'receivable'},{id:memberIds[1],name:'dan',cost:'475.07',paid:'0.00',expense:'0.00',received:'1030.62',profit:'166.26',net:'389.29',direction:'payable'}];
const records=[{id:'00000000-0000-4000-8000-000000000015',source:'quick-sale',name:'组合快速售出',time:'2026-10-12 11:00:00',quantity:3,cost:'695.00',shares:['320.00','375.00'],paid:['695.00','0.00'],price:'1030.62',fee:'0.00',seller:1},{id:'00000000-0000-4000-8000-00000000000b',source:'sale',name:'MMN 单封 · 樱',time:'2026-10-12 10:00:00',quantity:2,cost:'300.07',shares:['200.00','100.07'],paid:['300.07','0.00'],price:'349.22',fee:'0.00',seller:0}];
let step=2,scenario='normal',activeMember=0,returnFocus=null;const dialog=document.getElementById('member-dialog');
const nameOf=(index)=>scenario==='long-name'&&index===0?'follow · 这是用于检查多行展示与关闭按钮位置的很长人员姓名':members[index].name;
const labelOf=(record)=>scenario==='long-name'?record.name+' · 用于验证长商品名称换行且金额不被挤出的商品组合款式':record.name;
const currency=(value)=>'¥'+value;
function mainResult(member,index){return `<article class="result" data-ai-id="settlement-preview-member-result-${member.id}"><div class="result-heading"><div><strong class="result-name">${nameOf(index)}</strong><p class="muted">利润分成 ¥166.26 ＋ 成本返还 ¥${member.cost}${index===0?' ＋ 其他费用垫付 ¥52.25':''} － 已收销售款 ¥${member.received}</p></div><b class="${member.direction}">${index===0?'应收':'应付'} ¥389.29</b></div><button class="detail-trigger" type="button" data-ai-id="settlement-preview-member-details-${member.id}" onclick="openDetails(${index},this)">查看计算明细 <span class="arrow">›</span></button></article>`}
function renderMain(){
 document.querySelector('[data-ai-id="prototype-step-cost"]').setAttribute('aria-pressed',String(step===2));document.querySelector('[data-ai-id="prototype-step-preview"]').setAttribute('aria-pressed',String(step===3));document.getElementById('step-2').classList.toggle('active',step===2);document.getElementById('step-3').classList.toggle('active',step===3);
 document.getElementById('main').innerHTML=step===2?`<h1>确认利润比例</h1><p class="muted intro">成本承担根据现有销售成本和分摊记录展示，结算时不能修改。点击人员查看明细。</p><section class="card" data-ai-id="settlement-auto-cost-breakdown"><div class="row"><span>本次商品成本</span><strong>¥995.07</strong></div>${members.map((member,index)=>`<button type="button" class="member-trigger" data-ai-id="settlement-cost-share-${member.id}" onclick="openDetails(${index},this)"><span>${nameOf(index)} 承担成本</span><span class="amount-tail"><b>¥${member.cost}</b><span class="arrow">›</span></span></button>`).join('')}</section><h2>本次利润怎么分</h2><section class="card" data-ai-id="settlement-profit-allocation">${members.map((member,index)=>`<label class="row"><span>${nameOf(index)}</span><span class="percent"><input aria-label="${index===0?'第一位':'第二位'}人员利润比例" value="50" readonly data-ai-id="settlement-profit-share-${member.id}">%</span></label>`).join('')}</section>`:`<h1>账单预览</h1><section class="card summary-grid" data-ai-id="settlement-preview" style="margin-top:12px">${[['销售额','1379.84'],['平台手续费','0.00'],['净收款','1379.84'],['商品成本','995.07'],['其他费用','52.25'],['本次利润','332.52']].map(([label,value])=>`<div><small>${label}</small><strong>¥${value}</strong></div>`).join('')}</section><h2>本次结果</h2><section class="card" data-ai-id="settlement-preview-member-results">${members.map(mainResult).join('')}</section><h2>转账建议</h2><section class="card" data-ai-id="settlement-preview-transfers"><div class="row"><span>dan 给 follow</span><strong>¥389.29</strong></div></section>`;
 const next=document.querySelector('[data-ai-id="settlement-next"]');next.textContent=step===2?'下一步':'确认账单（原型不可提交）';next.disabled=step===3;
}
function setStep(value){closeDetails();step=value;renderMain()}
function nextStep(){if(step===2)setStep(3)}
function setScenario(value){closeDetails();scenario=value;renderMain()}
function personalSummary(member){return step===2?`<section class="person-summary" data-ai-id="settlement-member-details-summary"><p class="muted">本次承担商品成本</p><strong class="big">¥${member.cost}</strong><p class="muted">来自本次已选销售，包含筛选外已选记录。</p></section>`:`<section class="person-summary" data-ai-id="settlement-member-details-summary"><p class="muted">本次${member.direction==='receivable'?'应收':'应付'}</p><strong class="big ${member.direction}">¥${member.net}</strong><div class="formula" data-ai-id="settlement-member-details-formula"><div class="formula-line"><span>利润分成</span><strong>＋ ¥${member.profit}</strong></div><div class="formula-line"><span>成本返还</span><strong>＋ ¥${member.cost}</strong></div><div class="formula-line"><span>其他费用垫付</span><strong>＋ ¥${member.expense}</strong></div><div class="formula-line"><span>已收销售款</span><strong>－ ¥${member.received}</strong></div><div class="formula-line"><span>${member.direction==='receivable'?'本次应收':'本次应付'}</span><strong>¥${member.net}</strong></div></div></section>`}
function section(category,title,amount,contents,open=false){return `<details ${open?'open':''} data-ai-id="settlement-member-details-${category}"><summary><span class="category-title"><span class="chevron" aria-hidden="true">›</span>${title}</span><strong>${currency(amount)}</strong></summary><div class="category-content">${contents}</div></details>`}
function source(record){const suffix=record.source+'-'+record.id;return `<details class="source" data-ai-id="settlement-member-details-source-${suffix}"><summary>查看成本来源 <span aria-hidden="true">›</span></summary><div class="source-box">${record.source==='sale'?`<h3>普通销售 · 移动平均成本</h3><p>本笔成本来自已保存的库存销售成本，不指定某一笔采购。</p><div class="detail-line"><span>已记录销售成本</span><b>¥300.07</b></div><h3>本笔承担分摊</h3><div class="detail-line"><span>follow</span><b>¥200.00</b></div><div class="detail-line"><span>dan</span><b>¥100.07</b></div><h3>本笔采购付款归属</h3><div class="detail-line"><span>follow</span><b>¥300.07</b></div><div class="detail-line"><span>dan</span><b>¥0.00</b></div><p class="muted">未保存当时库存余额，不推算销售前的库存数量或均价。当前库存明细仅作参考。</p><button class="inventory-link" style="border:0;background:transparent;padding:0" type="button" data-ai-id="settlement-member-details-inventory-${suffix}" onclick="showInventoryReference(this)">查看库存明细 ›</button>`:`<h3>快速售出 · 填写成本</h3><p>结算采用商品项填写的本单成本。关联库存消耗成本是参考记录，两者可以不同。</p><div class="source-item" data-ai-id="settlement-member-details-quick-item-00000000-0000-4000-8000-00000000001f"><strong>商品项 1 · 组合卡片 · 2 件</strong><div class="detail-line"><span>填写的本单成本</span><b>¥400.00</b></div><div class="detail-line"><span>关联库存数量</span><b>2 件</b></div><div class="detail-line"><span>已记录库存消耗成本</span><b>¥350.00</b></div></div><div class="source-item" data-ai-id="settlement-member-details-quick-item-00000000-0000-4000-8000-000000000020"><strong>商品项 2 · 特典卡 · 1 件</strong><div class="detail-line"><span>填写的本单成本</span><b>¥295.00</b></div><div class="detail-line"><span>关联库存数量</span><b>1 件</b></div><div class="detail-line"><span>已记录库存消耗成本</span><b>¥190.00</b></div></div><h3>整单已有承担分摊</h3><div class="detail-line"><span>follow</span><b>¥320.00</b></div><div class="detail-line"><span>dan</span><b>¥375.00</b></div><h3>整单已有采购付款归属</h3><div class="detail-line"><span>follow</span><b>¥695.00</b></div><div class="detail-line"><span>dan</span><b>¥0.00</b></div><p class="muted">个人分摊记录保存到整单层级，未保存逐商品项的个人分摊，不推算补齐。</p>`}</div></details>`}
function showInventoryReference(button){let box=button.nextElementSibling;if(box?.classList.contains('origin-reference')){box.hidden=!box.hidden;return}box=document.createElement('p');box.className='origin-reference';box.textContent='原型仅示意入口。正式页面将进入该商品现有库存详情；当前库存不代表销售发生前的余额。';button.after(box)}
function costRows(){const extras=scenario==='long'?Array.from({length:24},(_,i)=>({id:'00000000-0000-4000-8000-'+(100+i).toString(16).padStart(12,'0'),source:'sale',name:'零成本样例商品 '+String(i+1).padStart(2,'0'),time:'2026-10-11 09:00:00',quantity:1,cost:'0.00',shares:['0.00','0.00'],paid:['0.00','0.00']})):[];
return [...records,...extras].map(record=>`<article class="transaction" data-ai-id="settlement-member-details-cost-record-${record.source}-${record.id}"><div class="item-title"><span class="tag">${record.source==='sale'?'普通销售':'快速售出'}</span>${labelOf(record)}</div><p class="item-meta">${record.time} · 售出 ${record.quantity} 件</p><div class="detail-line"><span>本笔商品成本</span><b>¥${record.cost}</b></div><div class="detail-line emphasis"><span>本人承担</span><b>${scenario==='missing'&&record.source==='quick-sale'?'缺少分摊记录':currency(scenario==='mismatch'&&record.source==='sale'?(activeMember===0?'199.99':'100.06'):record.shares[activeMember])}</b></div>${records.includes(record)?source(record):''}</article>`).join('')}
function paymentRows(){return activeMember===0?records.map(record=>`<article class="transaction" data-ai-id="settlement-member-details-payment-record-${record.source}-${record.id}"><div class="item-title">${labelOf(record)}</div><p class="item-meta">${record.time} · ${record.source==='sale'?'普通销售':'快速售出'}</p><div class="detail-line"><span>本人付款归属</span><b>¥${record.paid[0]}</b></div></article>`).join(''):'<div class="empty">本次没有归属你的采购付款金额。</div>'}
function receiptRows(){return records.filter(record=>record.seller===activeMember).map(record=>`<article class="transaction" data-ai-id="settlement-member-details-receipt-record-${record.source}-${record.id}"><div class="item-title">${labelOf(record)}</div><p class="item-meta">${record.time} · ${record.source==='sale'?'普通销售':'快速售出'}</p><div class="detail-line"><span>成交金额</span><b>¥${record.price}</b></div><div class="detail-line"><span>平台手续费</span><b>¥${record.fee}</b></div><div class="detail-line emphasis"><span>本人实收</span><b>¥${record.price}</b></div></article>`).join('')}
function renderPopup(){const member=members[activeMember],body=document.getElementById('popup-body');document.getElementById('popup-title').textContent=nameOf(activeMember)+' · 结算明细';document.getElementById('popup-subtitle').textContent=step===2?'成本承担与来源':'本次结果与组成记录';
if(scenario==='loading'){body.innerHTML='<div class="state" role="status" data-ai-id="settlement-member-details-loading"><span class="spinner" aria-hidden="true"></span><p>正在加载个人明细…</p></div>';return}
if(scenario==='error'){body.innerHTML='<div class="state" role="alert" data-ai-id="settlement-member-details-error"><p>明细加载失败，请重试。</p><p class="muted">已有选择、利润比例和结果保持不变。</p><button class="primary" type="button" data-ai-id="settlement-member-details-retry" onclick="retryDetails()">重试</button></div>';return}
let warning='';if(scenario==='mismatch')warning='<p class="notice" role="alert" data-ai-id="settlement-member-details-mismatch">明细与当前结果不一致，请返回重新核对。页面原金额保持不变。<br>当前成本汇总 ¥'+member.cost+'；示例明细合计 ¥'+(activeMember===0?'519.99':'475.06')+'。</p>';if(scenario==='missing')warning='<p class="notice" role="alert" data-ai-id="settlement-member-details-missing">部分销售缺少人员分摊记录，无法完整核对明细；不推算、不补齐，原结算金额保持不变。</p>';
if(scenario==='empty'){body.innerHTML=personalSummary(member)+'<div class="empty" data-ai-id="settlement-member-details-empty">暂无可展示的组成记录。<br>已有汇总金额保持不变，不生成推算明细。</div>';return}
const costs=costRows();const expenses=activeMember===0?'<article class="transaction" data-ai-id="settlement-member-details-expense-record-00000000-0000-4000-8000-000000000029"><div class="item-title">邮费</div><p class="item-meta">2026-10-12 11:10:00 · 关联组合快速售出</p><div class="detail-line"><span>本人垫付</span><b>¥52.25</b></div></article>':'<div class="empty">本次没有由你垫付的费用。</div>';
body.innerHTML=personalSummary(member)+warning+'<div class="categories">'+section('cost','成本承担',member.cost,'<p class="category-note">以下明细包含本次全部已选销售。金额来自已有分摊记录。</p>'+costs,true)+section('payments','采购付款归属',member.paid,'<p class="category-note">本次销售成本对应的付款分摊，不是批次全部采购付款。不额外加入应收/应付公式，付款人和成本承担人可能不同。</p>'+paymentRows())+section('expenses','费用垫付',member.expense,expenses)+section('receipts','已收销售款',member.received,'<p class="category-note">成交金额扣除平台手续费后的本人收款。</p>'+receiptRows())+(step===3?section('profit','利润分成',member.profit,'<div class="transaction"><div class="detail-line"><span>本次净利润</span><b>¥332.52</b></div><div class="detail-line"><span>本人利润比例</span><b>50%</b></div><div class="detail-line emphasis"><span>实际分配金额</span><b>¥166.26</b></div><p class="item-meta">以已有预览结果为准；按分处理的尾差不在弹窗重新计算。</p></div>'):'')+'</div>';body.scrollTop=0;
}
function openDetails(index,trigger){activeMember=index;returnFocus=trigger;renderPopup();dialog.showModal();document.querySelector('[data-ai-id="settlement-member-details-close"]').focus({preventScroll:true});document.getElementById('popup-body').scrollTop=0;document.body.style.overflow='hidden'}
function closeDetails(){if(dialog.open)dialog.close()}
dialog.addEventListener('keydown',event=>{if(event.key!=='Tab')return;const nodes=[...dialog.querySelectorAll('button:not(:disabled),summary,a[href],input:not(:disabled),[tabindex="0"]')].filter(node=>node.getClientRects().length>0);if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}});
dialog.addEventListener('close',()=>{document.body.style.overflow='';if(returnFocus?.isConnected)returnFocus.focus()});
dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDetails()}});
function retryDetails(){scenario='normal';document.querySelector('[data-ai-id="prototype-scenario"]').value='normal';renderPopup()}
renderMain();
</script></body></html>
