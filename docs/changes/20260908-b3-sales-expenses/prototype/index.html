<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B3 交易与费用原型</title><style>body{margin:0;background:#f5f7fb;color:#172033;font:14px system-ui,"Microsoft YaHei"}.app{max-width:430px;min-height:100vh;margin:auto;background:#fff}main{padding:20px}h1{font-size:23px}.row,button{min-height:44px;padding:12px;border:0;border-radius:8px;background:#f5f7fb;font:inherit}.row{display:flex;justify-content:space-between;margin:8px 0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.active,button{background:#3657c8;color:#fff}.hidden{display:none}.note{padding:10px;background:#edf1ff;color:#2949aa;border-radius:8px}</style><div class="app" data-ai-id="b3-prototype"><main id="batch"><h1>批次详情</h1><div class="row" data-ai-id="batch-transactions-entry" onclick="show('transaction')"><span>交易记录<br><small>记录销售和费用</small></span><span>›</span></div></main><main id="transaction" class="hidden" data-ai-id="transaction-page"><button onclick="show('batch')">返回批次</button><h1>交易</h1><div class="tabs" data-ai-id="transaction-tabs"><button data-ai-id="transaction-sales-tab" onclick="tab('sales')">销售</button><button data-ai-id="transaction-expenses-tab" onclick="tab('expenses')">费用</button></div><section id="sales" data-ai-id="sale-list"><p class="note">销售可直接登记，不需要先上架。</p><button data-ai-id="sale-create" onclick="show('saleForm')">记录销售</button></section><section id="expenses" class="hidden" data-ai-id="expense-list"><button data-ai-id="expense-create" onclick="show('expenseForm')">记录费用</button></section></main><main id="saleForm" class="hidden" data-ai-id="sale-form-page"><h1>记录销售</h1><p class="note" data-ai-id="sale-available-quantity">丹恒小卡当前可卖：2 件</p><p>商品 <select data-ai-id="sale-product-select"><option>丹恒小卡</option></select></p><p>数量 <input data-ai-id="sale-quantity" value="1"></p><p>成交总价 <input data-ai-id="sale-price" value="99.0"></p><p>卖出人 <select data-ai-id="sale-seller-select"><option>B</option></select></p><p class="note">谁卖出，销售款就记在谁名下。</p><button data-ai-id="sale-submit" onclick="show('transaction')">保存并减少库存</button></main><main id="expenseForm" class="hidden" data-ai-id="expense-form-page"><h1>记录费用</h1><p>类型 <select data-ai-id="expense-type-select"><option>邮费</option></select></p><p>金额 <input data-ai-id="expense-amount" value="8.0"></p><p>付款人 <select data-ai-id="expense-payer-select"><option>A</option></select></p><button data-ai-id="expense-submit" onclick="show('transaction')">保存费用</button></main></div><script>function show(id){document.querySelectorAll('main').forEach(e=>e.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}function tab(id){['sales','expenses'].forEach(n=>document.getElementById(n).classList.toggle('hidden',n!==id))}</script></html>
