<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThunderLedger B2 商品资料与图片原型</title>
  <style>
    :root { --canvas:#f5f7fb; --surface:#fff; --ink:#172033; --body:#364152; --muted:#7b879a; --line:#e4e8f0; --primary:#3657c8; --primary-soft:#eef2ff; --danger:#b42318; --danger-soft:#fef3f2; --success:#137a4b; --success-soft:#eaf7f0; --focus:#91a8ff; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; background:#e9edf5; color:var(--ink); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input,textarea { font:inherit; }
    button { min-height:44px; border:0; cursor:pointer; }
    button:focus-visible,input:focus-visible,textarea:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    .phone { position:relative; width:100%; max-width:480px; min-height:100vh; margin:0 auto; overflow:hidden; background:var(--canvas); }
    .topbar { position:sticky; top:0; z-index:3; display:flex; height:56px; align-items:center; justify-content:space-between; gap:12px; padding:0 16px; border-bottom:1px solid var(--line); background:var(--surface); }
    .brand { min-width:0; overflow:hidden; font-size:15px; letter-spacing:.1px; text-overflow:ellipsis; white-space:nowrap; } .brand small { display:none; }
    .workspace { display:flex; min-width:0; max-width:58%; align-items:center; gap:4px; padding:0; background:transparent; color:var(--primary); font-size:13px; font-weight:700; } .workspace span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    main { min-height:calc(100vh - 114px); padding:20px 16px 96px; }
    .page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; } .page-head > div { min-width:0; } .page-head > .primary { flex:0 0 auto; } h1,h2,p { margin:0; } h1 { font-size:24px; line-height:1.25; } h2 { font-size:17px; } .eyebrow,.hint { color:var(--muted); font-size:12px; } .eyebrow { display:block; margin-bottom:4px; font-weight:700; }
    .primary,.secondary,.text-button,.state-button { border-radius:9px; font-weight:700; } .primary { padding:0 14px; background:var(--primary); color:#fff; } .primary:disabled { background:#9ca9d9; cursor:not-allowed; } .secondary { padding:0 14px; border:1px solid var(--line); background:var(--surface); color:var(--body); } .text-button { min-height:32px; padding:0 6px; background:transparent; color:var(--primary); } .danger { color:var(--danger); }
    .search-wrap { position:relative; margin-bottom:14px; } .search-wrap input { width:100%; height:44px; padding:0 40px 0 40px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); } .search-icon { position:absolute; left:14px; top:12px; color:var(--muted); } .search-clear { position:absolute; top:0; right:5px; min-height:44px; padding:0 10px; background:transparent; color:var(--muted); }
    .prototype-tools { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:0 0 14px; padding:9px 10px; border:1px dashed #c9d1e5; border-radius:10px; background:#f8faff; } .prototype-tools span { width:100%; color:var(--muted); font-size:11px; } .state-button { min-height:32px; padding:0 9px; border:1px solid #d6ddec; background:#fff; color:var(--body); font-size:12px; }
    .readonly { display:flex; align-items:flex-start; gap:8px; margin:0 0 14px; padding:10px 12px; border-radius:10px; background:#f0f3f8; color:var(--body); font-size:13px; } .readonly strong { color:var(--ink); }
    .list { overflow:hidden; border:1px solid var(--line); border-radius:12px; background:var(--surface); } .product-item { display:grid; width:100%; min-height:88px; grid-template-columns:64px minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 14px; border-radius:0; border-bottom:1px solid var(--line); background:var(--surface); color:var(--ink); text-align:left; } .product-item:last-child { border-bottom:0; } .product-item:hover { background:#fafbff; } .product-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:800; } .product-desc { display:-webkit-box; margin-top:4px; overflow:hidden; color:var(--muted); font-size:12px; -webkit-box-orient:vertical; -webkit-line-clamp:1; } .price { display:block; margin-top:5px; color:var(--body); font-size:12px; font-weight:700; } .arrow { color:#9aa5b6; font-size:20px; }
    .product-cover,.image-thumb,.image-empty { position:relative; display:grid; overflow:hidden; place-items:center; border:1px solid #dce2ee; border-radius:10px; background:#edf1f7; color:#4d5c72; } .product-cover { width:64px; height:64px; } .image-empty { min-height:128px; color:var(--muted); font-size:13px; } .product-art { display:grid; width:100%; height:100%; place-items:center; font-size:30px; } .art-jacket { background:#dce6ff; } .art-lamp { background:#f5ead5; } .art-book { background:#e6ece9; } .art-custom { background:#e8edf8; } .cover-tag { position:absolute; top:5px; left:5px; padding:2px 5px; border-radius:4px; background:#172033cc; color:#fff; font-size:10px; font-weight:700; }
    .state { display:grid; min-height:220px; place-items:center; padding:28px 22px; border:1px solid var(--line); border-radius:12px; background:var(--surface); text-align:center; } .state > div { max-width:270px; } .state h2 { margin-bottom:7px; } .state p { margin-bottom:16px; color:var(--muted); } .error { border-color:#f0c9c5; background:var(--danger-soft); } .skeleton { display:grid; gap:12px; width:100%; } .skeleton div { height:52px; border-radius:9px; background:linear-gradient(90deg,#eef1f6 20%,#f7f8fa 38%,#eef1f6 60%); background-size:200% 100%; animation:shine 1.1s linear infinite; } @keyframes shine { to { background-position:-200% 0; } }
    .bottom-nav { position:fixed; z-index:4; bottom:0; left:50%; display:grid; width:min(100%,480px); height:58px; grid-template-columns:repeat(4,1fr); transform:translateX(-50%); border-top:1px solid var(--line); background:var(--surface); } .bottom-nav button { display:grid; min-height:58px; place-items:center; gap:1px; background:transparent; color:var(--muted); font-size:11px; } .bottom-nav button.active { color:var(--primary); font-weight:800; } .nav-icon { font-size:18px; line-height:1; }
    .screen { position:absolute; z-index:6; inset:0; min-height:100vh; overflow:auto; background:var(--canvas); } .screen[hidden] { display:none; } .screen-bar { position:sticky; top:0; z-index:2; display:flex; height:62px; align-items:center; gap:8px; padding:0 12px; border-bottom:1px solid var(--line); background:var(--surface); } .back { min-width:44px; padding:0; background:transparent; color:var(--primary); font-size:24px; } .screen-bar h1 { flex:1; font-size:17px; } .screen-content { padding:22px 16px 104px; } .detail-title { margin:5px 0 20px; font-size:26px; } .detail-list { overflow:hidden; border:1px solid var(--line); border-radius:12px; background:var(--surface); } .detail-row { padding:14px; border-bottom:1px solid var(--line); } .detail-row:last-child { border-bottom:0; } .detail-row small { display:block; margin-bottom:5px; color:var(--muted); font-size:12px; } .detail-row p { white-space:pre-wrap; color:var(--body); } .detail-actions,.form-actions { position:fixed; z-index:3; bottom:0; left:50%; display:grid; width:min(100%,480px); grid-template-columns:1fr; gap:8px; padding:12px 16px max(12px,env(safe-area-inset-bottom)); transform:translateX(-50%); border-top:1px solid var(--line); background:var(--surface); } .form-actions { grid-template-columns:1fr 1.3fr; }
    .form-note { margin:0 0 16px; color:var(--muted); font-size:13px; } .field { display:grid; gap:7px; margin:0 0 16px; } .field label { color:var(--body); font-size:13px; font-weight:800; } .field input,.field textarea { width:100%; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); } .field input { height:46px; padding:0 12px; } .field textarea { min-height:110px; padding:12px; resize:vertical; } .field-error { margin-top:-8px; color:var(--danger); font-size:12px; } .form-status { margin:4px 0 12px; color:var(--danger); font-size:13px; }
    .image-section { margin:0 0 18px; } .section-label { display:flex; align-items:center; justify-content:space-between; margin:0 0 9px; color:var(--body); font-size:13px; font-weight:800; } .image-help { margin:0 0 10px; color:var(--muted); font-size:12px; } .image-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; } .image-tile { position:relative; min-height:104px; overflow:hidden; border:1px solid var(--line); border-radius:10px; background:var(--surface); } .image-thumb { width:100%; height:104px; border:0; border-radius:0; } .image-tile-actions { display:grid; grid-template-columns:1fr 40px; border-top:1px solid var(--line); } .image-tile-actions button { min-height:34px; padding:0 4px; background:#fff; color:var(--primary); font-size:11px; font-weight:700; } .image-tile-actions button + button { border-left:1px solid var(--line); color:var(--danger); font-size:16px; } .image-add { display:grid; min-height:104px; place-items:center; border:1px dashed #b5c0d7; border-radius:10px; background:#f8faff; color:var(--primary); font-size:13px; font-weight:700; text-align:center; } .uploading { display:grid; width:100%; height:104px; place-items:center; background:#edf1f7; color:var(--body); font-size:12px; text-align:center; } .upload-error { background:var(--danger-soft); color:var(--danger); } .detail-images { display:grid; grid-template-columns:1fr; gap:8px; margin:14px 0 18px; } .carousel-image { position:relative; display:grid; height:184px; place-items:center; overflow:hidden; border:1px solid #dce2ee; border-radius:12px; background:#edf1f7; font-size:56px; } .carousel-image img { width:100%; height:100%; object-fit:contain; } .carousel-caption { position:absolute; right:8px; bottom:8px; left:8px; padding:5px 7px; border-radius:6px; background:#172033b8; color:#fff; font-size:11px; text-align:center; } .carousel-controls { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; } .carousel-controls button { min-height:40px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--primary); font-weight:700; } .carousel-controls button:disabled { color:#a0aabc; cursor:not-allowed; } .carousel-index { color:var(--muted); font-size:12px; font-weight:700; text-align:center; }
    .modal-backdrop { position:fixed; z-index:10; inset:0; display:grid; place-items:center; padding:20px; background:#17203366; } .dialog { width:min(100%,360px); padding:20px; border-radius:14px; background:var(--surface); box-shadow:0 16px 40px #17203333; } .dialog h2 { margin-bottom:8px; } .dialog p { color:var(--body); } .dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
    .image-preview { position:fixed; z-index:12; inset:0; display:grid; grid-template-rows:auto minmax(0,1fr) auto; background:#111827; color:#fff; } .image-preview-head,.image-preview-foot { display:flex; min-height:62px; align-items:center; justify-content:space-between; padding:0 16px; } .image-preview-head { border-bottom:1px solid #ffffff2e; } .preview-close { min-height:44px; padding:0 8px; background:transparent; color:#fff; font-size:26px; } .preview-status { color:#d6dded; font-size:13px; font-weight:700; } .preview-stage { display:grid; min-height:0; place-items:center; padding:18px; } .preview-image { display:grid; width:min(100%,390px); height:min(58vh,430px); place-items:center; overflow:hidden; border-radius:14px; background:#263248; font-size:88px; } .preview-image img { width:100%; height:100%; object-fit:contain; } .image-preview-foot { justify-content:center; gap:10px; border-top:1px solid #ffffff2e; } .image-preview-foot button { min-width:116px; background:#ffffff18; color:#fff; } .image-preview-foot button:disabled { color:#8b97ac; cursor:not-allowed; }
    .toast { position:fixed; z-index:20; bottom:76px; left:50%; width:calc(100% - 32px); max-width:448px; padding:11px 14px; transform:translateX(-50%); border:1px solid #b8dfc9; border-radius:10px; background:var(--success-soft); color:var(--success); font-weight:700; text-align:center; } .toast[hidden] { display:none; }
    @media (max-width:480px) { body { background:var(--canvas); } }
  </style>
</head>
<body>
  <div class="phone" data-ai-id="product-list-page">
    <header class="topbar" data-ai-id="topbar">
      <div class="brand" data-ai-id="app-brand"><strong>ThunderLedger</strong></div>
      <button class="workspace" type="button" data-ai-id="workspace-selector" aria-label="当前工作区，二手经营协作空间"><span>二手经营协作空间</span><span aria-hidden="true">⌄</span></button>
    </header>

    <main>
      <section class="page-head" data-ai-id="product-list-header">
        <div><h1>商品</h1></div>
        <button id="create-product" class="primary" type="button" data-ai-id="product-create">+ 新建</button>
      </section>

      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="product-search-input" type="search" placeholder="搜索商品名称" autocomplete="off" data-ai-id="product-search">
        <button id="clear-search" class="search-clear" type="button" data-ai-id="product-search-clear" hidden aria-label="清除搜索">×</button>
      </div>

      <section class="prototype-tools" data-ai-id="prototype-state-controls" aria-label="原型状态演示">
        <span>原型状态演示（不属于正式业务入口）</span>
        <button id="show-loading" class="state-button" type="button" data-ai-id="prototype-show-loading">加载中</button>
        <button id="show-empty" class="state-button" type="button" data-ai-id="prototype-show-empty">空列表</button>
        <button id="show-error" class="state-button" type="button" data-ai-id="prototype-show-error">加载失败</button>
        <button id="reset-state" class="state-button" type="button" data-ai-id="prototype-reset-state">恢复列表</button>
        <button id="role-toggle" class="state-button" type="button" data-ai-id="prototype-role-toggle">切换为查看者</button>
      </section>

      <div id="readonly-notice" class="readonly" data-ai-id="product-list-readonly-notice" hidden><span aria-hidden="true">ⓘ</span><span><strong>查看者模式</strong><br>你可查看商品资料，但不能新建或编辑。</span></div>
      <section id="product-list" class="list" data-ai-id="product-list" aria-live="polite"></section>
    </main>

    <nav class="bottom-nav" data-ai-id="bottom-navigation" aria-label="底部导航">
      <button type="button" data-ai-id="nav-workspace"><span class="nav-icon">⌂</span>工作区</button>
      <button class="active" type="button" data-ai-id="nav-products"><span class="nav-icon">▧</span>商品</button>
      <button type="button" data-ai-id="nav-batches"><span class="nav-icon">▣</span>批次</button>
      <button type="button" data-ai-id="nav-profile"><span class="nav-icon">◉</span>我的</button>
    </nav>

    <section id="detail-screen" class="screen" data-ai-id="product-detail-page" hidden>
      <header class="screen-bar" data-ai-id="product-detail-topbar"><button id="detail-back" class="back" type="button" aria-label="返回商品列表">‹</button><h1>商品详情</h1></header>
      <main class="screen-content"><h2 id="detail-name" class="detail-title"></h2><section id="detail-images" class="detail-images" data-ai-id="product-detail-images"></section><section class="detail-list" data-ai-id="product-detail-content"><div class="detail-row"><small>商品描述</small><p id="detail-description"></p></div><div class="detail-row"><small>参考价</small><p id="detail-price"></p></div></section><div id="detail-readonly" class="readonly" data-ai-id="product-detail-readonly-notice" hidden><span aria-hidden="true">ⓘ</span><span><strong>只读权限</strong><br>当前角色不能编辑此商品。</span></div></main>
      <footer id="detail-actions" class="detail-actions"><button id="edit-product" class="primary" type="button" data-ai-id="product-edit">编辑商品</button></footer>
    </section>

    <section id="form-screen" class="screen" data-ai-id="product-form-page" hidden>
      <header class="screen-bar" data-ai-id="product-form-topbar"><button id="form-back" class="back" type="button" aria-label="返回">‹</button><h1 id="form-title">新建商品</h1></header>
      <main class="screen-content"><p class="form-note">商品资料属于当前工作区。图片仅在原型中本地预览，不会上传或保存。</p><form id="product-form" data-ai-id="product-form" novalidate><div class="field"><label for="product-name">商品名称 <span class="danger">*</span></label><input id="product-name" type="text" data-ai-id="product-name" placeholder="例如：复古牛仔外套"><span id="name-error" class="field-error" data-ai-id="product-form-name-error" hidden>请填写商品名称</span></div><section class="image-section" data-ai-id="product-image-section"><div class="section-label"><span>商品图片</span><button id="image-add" class="text-button" type="button" data-ai-id="product-image-add">+ 添加图片</button></div><p class="image-help">首张图片自动设为封面；可调整封面或移除图片。</p><input id="image-input" type="file" accept="image/*" multiple data-ai-id="product-image-input" hidden><div id="form-image-list" class="image-grid" data-ai-id="product-image-list"></div></section><div class="field"><label for="product-description">商品描述</label><textarea id="product-description" data-ai-id="product-description" placeholder="记录材质、规格或品相等基础信息"></textarea></div><div class="field"><label for="product-reference-price">参考价（元）</label><input id="product-reference-price" type="text" inputmode="decimal" data-ai-id="product-reference-price" placeholder="可选，例如 99.9"><span id="price-error" class="field-error" data-ai-id="product-form-price-error" hidden>请输入非负金额，最多保留一位小数</span></div><p id="saving-status" class="form-status" data-ai-id="product-form-saving" hidden>正在保存，请稍候…</p></form></main>
      <footer class="form-actions"><button id="form-cancel" class="secondary" type="button" data-ai-id="product-form-cancel">取消</button><button id="form-submit" class="primary" type="button" data-ai-id="product-form-submit">保存商品</button></footer>
    </section>

    <section id="discard-dialog" class="modal-backdrop" data-ai-id="product-discard-confirm" hidden role="dialog" aria-modal="true" aria-labelledby="discard-title"><div class="dialog"><h2 id="discard-title">放弃未保存变更？</h2><p>返回后本次填写内容不会保存。</p><div class="dialog-actions"><button id="discard-cancel" class="secondary" type="button" data-ai-id="product-discard-cancel">继续编辑</button><button id="discard-confirm" class="primary" type="button" data-ai-id="product-discard-confirm-action">放弃变更</button></div></div></section>
    <section id="image-remove-dialog" class="modal-backdrop" data-ai-id="product-image-remove-confirm" hidden role="dialog" aria-modal="true" aria-labelledby="image-remove-title"><div class="dialog"><h2 id="image-remove-title">移除这张图片？</h2><p>这只会从当前商品移除图片关联，不会删除图片资源。</p><div class="dialog-actions"><button id="image-remove-cancel" class="secondary" type="button" data-ai-id="product-image-remove-cancel">保留图片</button><button id="image-remove-confirm" class="primary" type="button" data-ai-id="product-image-remove-confirm-action">移除图片</button></div></div></section>
    <section id="image-preview" class="image-preview" data-ai-id="product-image-preview" hidden role="dialog" aria-modal="true" aria-label="商品图片大图预览"><header class="image-preview-head"><span id="preview-index" class="preview-status" data-ai-id="product-image-preview-index"></span><button id="preview-close" class="preview-close" type="button" data-ai-id="product-image-preview-close" aria-label="关闭图片预览">×</button></header><div class="preview-stage"><div id="preview-current" class="preview-image" data-ai-id="product-image-preview-current"></div></div><footer class="image-preview-foot"><button id="preview-previous" class="secondary" type="button" data-ai-id="product-image-preview-previous">‹ 上一张</button><button id="preview-next" class="secondary" type="button" data-ai-id="product-image-preview-next">下一张 ›</button></footer></section>
    <div id="success-toast" class="toast" data-ai-id="product-success-toast" hidden role="status"></div>
  </div>

  <script>
    const products = [
      { id: 'demo-jacket', name: '复古牛仔外套', description: '深蓝色，M 码，领口轻微做旧。', price: '128.0', images: [{ id: 'demo-jacket-image-1', art: 'jacket', icon: '🧥' }, { id: 'demo-jacket-image-2', art: 'jacket', icon: '🧥' }] },
      { id: 'demo-lamp', name: '玻璃台灯', description: '', price: '', images: [] },
      { id: 'demo-book', name: '摄影作品集', description: '内页完整，适合收藏或陈列。', price: '66.5', images: [{ id: 'demo-book-image-1', art: 'book', icon: '▤' }] }
    ];
    let mode = 'list'; let role = 'editor'; let selectedId = null; let editingId = null; let formInitial = ''; let listState = 'default'; let toastTimer = null; let formImages = []; let pendingRemovalImageId = null; let imageSequence = 1;
    const list = document.querySelector('#product-list'); const search = document.querySelector('#product-search-input'); const clearSearch = document.querySelector('#clear-search'); const createButton = document.querySelector('#create-product'); const readonlyNotice = document.querySelector('#readonly-notice'); const detailScreen = document.querySelector('#detail-screen'); const formScreen = document.querySelector('#form-screen'); const discardDialog = document.querySelector('#discard-dialog'); const imageRemoveDialog = document.querySelector('#image-remove-dialog'); const form = document.querySelector('#product-form'); const nameInput = document.querySelector('#product-name'); const descriptionInput = document.querySelector('#product-description'); const priceInput = document.querySelector('#product-reference-price'); const imageInput = document.querySelector('#image-input'); const formImageList = document.querySelector('#form-image-list'); const nameError = document.querySelector('#name-error'); const priceError = document.querySelector('#price-error'); const savingStatus = document.querySelector('#saving-status'); const submitButton = document.querySelector('#form-submit');
    const filteredProducts = () => { const keyword = search.value.trim().toLowerCase(); return keyword ? products.filter((product) => product.name.toLowerCase().includes(keyword)) : products; };
    const priceText = (price) => price ? `参考价 ¥${price}` : '未设置参考价';
    const escapeHtml = (value) => value.replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
    const cloneImages = (images) => images.map((image) => ({ ...image }));
    const coverOf = (product) => product.images[0];
    const imageVisual = (image) => image?.url ? `<img class="image-thumb" src="${image.url}" alt="商品图片">` : `<span class="product-art art-${image?.art || 'custom'}">${image?.icon || '▧'}</span>`;
    const listCover = (product) => { const image = coverOf(product); return image ? `<span class="product-cover" data-ai-id="product-list-cover-${product.id}">${imageVisual(image)}<span class="cover-tag">首图</span></span>` : `<span class="product-cover" data-ai-id="product-list-no-image-${product.id}">无图</span>`; };
    const renderList = () => {
      clearSearch.hidden = !search.value; readonlyNotice.hidden = role !== 'viewer'; createButton.hidden = role === 'viewer' || listState === 'loading';
      if (listState === 'loading') { list.innerHTML = '<section class="state" data-ai-id="product-list-loading"><div class="skeleton"><div></div><div></div><div></div></div></section>'; return; }
      if (listState === 'error') { list.innerHTML = '<section class="state error" data-ai-id="product-list-error"><div><h2>商品列表加载失败</h2><p>请检查网络后重试，已有搜索词不会丢失。</p><button id="retry-list" class="primary" type="button" data-ai-id="product-list-retry">重新加载</button></div></section>'; document.querySelector('#retry-list').onclick = () => { listState = 'default'; renderList(); }; return; }
      if (listState === 'empty') { list.innerHTML = `<section class="state" data-ai-id="product-list-empty"><div><h2>还没有商品资料</h2><p>${role === 'viewer' ? '当前角色为查看者，暂无可查看的商品资料。' : '请使用标题右侧的“新建”建立第一条商品资料。'}</p></div></section>`; return; }
      const items = filteredProducts(); if (!items.length) { list.innerHTML = '<section class="state" data-ai-id="product-search-empty"><div><h2>未找到匹配商品</h2><p>请修改商品名称关键词，或清除搜索查看全部商品。</p><button id="clear-search-empty" class="secondary" type="button" data-ai-id="product-search-empty-clear">清除搜索</button></div></section>'; document.querySelector('#clear-search-empty').onclick = clearCurrentSearch; return; }
      list.innerHTML = items.map((product) => `<button class="product-item" type="button" data-product-id="${product.id}" data-ai-id="product-item-${product.id}">${listCover(product)}<span><span class="product-name">${escapeHtml(product.name)}</span><span class="product-desc">${escapeHtml(product.description || '未填写描述')}</span><span class="price">${priceText(product.price)}</span></span><span class="arrow" aria-hidden="true">›</span></button>`).join(''); list.querySelectorAll('[data-product-id]').forEach((item) => item.onclick = () => openDetail(item.dataset.productId));
    };
    let carouselIndex = 0;
    const renderDetailImages = (product) => { const images = product.images; if (!images.length) return '<div class="image-empty">暂无商品图片</div>'; carouselIndex = Math.max(0, Math.min(carouselIndex, images.length - 1)); const image = images[carouselIndex]; return `<button id="carousel-current" class="carousel-image" type="button" data-ai-id="product-detail-image-${image.id}" aria-label="查看第 ${carouselIndex + 1} 张图片大图">${imageVisual(image)}<span class="carousel-caption">点击查看大图</span></button><div class="carousel-controls"><button id="carousel-previous" type="button" data-ai-id="product-image-carousel-previous" ${carouselIndex === 0 ? 'disabled' : ''}>‹ 上一张</button><span class="carousel-index" data-ai-id="product-image-carousel-index">第 ${carouselIndex + 1} / ${images.length} 张</span><button id="carousel-next" type="button" data-ai-id="product-image-carousel-next" ${carouselIndex === images.length - 1 ? 'disabled' : ''}>下一张 ›</button></div>`; };
    const renderPreview = (product) => { const images = product.images; const image = images[carouselIndex]; document.querySelector('#preview-current').innerHTML = imageVisual(image); document.querySelector('#preview-index').textContent = `第 ${carouselIndex + 1} / ${images.length} 张`; document.querySelector('#preview-previous').disabled = carouselIndex === 0; document.querySelector('#preview-next').disabled = carouselIndex === images.length - 1; };
    const openPreview = (product) => { renderPreview(product); document.querySelector('#image-preview').hidden = false; };
    const bindCarousel = (product) => { const previous = document.querySelector('#carousel-previous'); const next = document.querySelector('#carousel-next'); const current = document.querySelector('#carousel-current'); if (previous) previous.onclick = () => { carouselIndex--; document.querySelector('#detail-images').innerHTML = renderDetailImages(product); bindCarousel(product); }; if (next) next.onclick = () => { carouselIndex++; document.querySelector('#detail-images').innerHTML = renderDetailImages(product); bindCarousel(product); }; if (current) current.onclick = () => openPreview(product); };
    const openDetail = (id) => { selectedId = id; carouselIndex = 0; const product = products.find((item) => item.id === id); document.querySelector('#detail-name').textContent = product.name; document.querySelector('#detail-description').textContent = product.description || '未填写描述'; document.querySelector('#detail-price').textContent = priceText(product.price); document.querySelector('#detail-images').innerHTML = renderDetailImages(product); bindCarousel(product); document.querySelector('#detail-readonly').hidden = role !== 'viewer'; document.querySelector('#detail-actions').hidden = role === 'viewer'; detailScreen.hidden = false; mode = 'detail'; };
    const renderFormImages = () => { const addButton = document.querySelector('#image-add'); addButton.disabled = formImages.length >= 5; addButton.textContent = formImages.length >= 5 ? '最多 5 张' : '+ 添加图片'; if (!formImages.length) { formImageList.innerHTML = '<div class="image-empty">暂无图片</div>'; return; } formImageList.innerHTML = formImages.map((image, index) => { if (image.status === 'uploading') return '<div class="image-tile" data-ai-id="product-image-uploading"><div class="uploading">图片上传中…</div></div>'; if (image.status === 'error') return `<div class="image-tile" data-ai-id="product-image-upload-error"><div class="uploading upload-error">上传失败<br><button class="text-button" data-image-retry="${image.id}" data-ai-id="product-image-retry-${image.id}">重试</button></div></div>`; return `<div class="image-tile" data-ai-id="product-image-item-${image.id}"><div class="image-thumb">${imageVisual(image)}${index === 0 ? `<span class="cover-tag" data-ai-id="product-image-first-${image.id}">首图</span>` : ''}</div><div class="image-tile-actions">${index === 0 ? '<button type="button" disabled>当前首图</button>' : `<button type="button" data-image-move-first="${image.id}" data-ai-id="product-image-move-first-${image.id}">移到首图</button>`}<button type="button" data-image-remove="${image.id}" data-ai-id="product-image-remove-${image.id}" aria-label="删除图片" title="删除图片"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 12H7L6 9Zm4 3v6h2v-6h-2Zm4 0v6h2v-6h-2Z"/></svg></button></div></div>`; }).join(''); formImageList.querySelectorAll('[data-image-move-first]').forEach((button) => button.onclick = () => { const index = formImages.findIndex((image) => image.id === button.dataset.imageMoveFirst); formImages.unshift(formImages.splice(index, 1)[0]); renderFormImages(); }); formImageList.querySelectorAll('[data-image-remove]').forEach((button) => button.onclick = () => { pendingRemovalImageId = button.dataset.imageRemove; imageRemoveDialog.hidden = false; }); formImageList.querySelectorAll('[data-image-retry]').forEach((button) => button.onclick = () => retryImage(button.dataset.imageRetry)); };
    const formSnapshot = () => JSON.stringify({ name: nameInput.value, description: descriptionInput.value, price: priceInput.value, images: formImages.map((image) => ({ id: image.id, cover: image.cover, status: image.status })) });
    const openForm = (id = null) => { editingId = id; const product = id ? products.find((item) => item.id === id) : null; document.querySelector('#form-title').textContent = product ? '编辑商品' : '新建商品'; nameInput.value = product ? product.name : ''; descriptionInput.value = product ? product.description : ''; priceInput.value = product ? product.price : ''; formImages = cloneImages(product?.images || []); renderFormImages(); formInitial = formSnapshot(); nameError.hidden = true; priceError.hidden = true; savingStatus.hidden = true; formScreen.hidden = false; mode = 'form'; nameInput.focus(); };
    const closeForm = () => { formScreen.hidden = true; mode = editingId ? 'detail' : 'list'; if (editingId) detailScreen.hidden = false; };
    const hasChanges = () => formSnapshot() !== formInitial; const requestFormClose = () => { if (hasChanges()) { discardDialog.hidden = false; return; } closeForm(); }; const clearCurrentSearch = () => { search.value = ''; renderList(); search.focus(); }; const showToast = (message) => { const toast = document.querySelector('#success-toast'); toast.textContent = message; toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.hidden = true; }, 2200); };
    const addFiles = (files) => { [...files].slice(0, Math.max(0, 5 - formImages.length)).forEach((file) => { const image = { id: `prototype-image-${imageSequence++}`, art: 'custom', icon: '▧', url: URL.createObjectURL(file), status: 'uploading' }; formImages.push(image); setTimeout(() => { image.status = 'ready'; renderFormImages(); }, 650); }); renderFormImages(); imageInput.value = ''; };
    const retryImage = (id) => { const image = formImages.find((item) => item.id === id); if (!image) return; image.status = 'uploading'; renderFormImages(); setTimeout(() => { image.status = 'ready'; renderFormImages(); }, 650); };
    const save = () => { const name = nameInput.value.trim(); const price = priceInput.value.trim(); const validPrice = !price || /^\d+(\.\d)?$/.test(price); nameError.hidden = Boolean(name); priceError.hidden = validPrice; if (!name || !validPrice) return; if (formImages.some((image) => image.status === 'uploading')) { savingStatus.textContent = '图片仍在处理中，请稍候…'; savingStatus.hidden = false; return; } savingStatus.textContent = '正在保存，请稍候…'; savingStatus.hidden = false; submitButton.disabled = true; setTimeout(() => { if (editingId) { const product = products.find((item) => item.id === editingId); Object.assign(product, { name, description: descriptionInput.value.trim(), price, images: cloneImages(formImages) }); closeForm(); openDetail(editingId); showToast('商品已保存'); } else { const id = `demo-product-${products.length + 1}`; products.unshift({ id, name, description: descriptionInput.value.trim(), price, images: cloneImages(formImages) }); closeForm(); search.value = ''; listState = 'default'; renderList(); showToast('商品已创建'); } savingStatus.hidden = true; submitButton.disabled = false; }, 500); };
    search.oninput = () => { listState = 'default'; renderList(); }; document.querySelector('#clear-search').onclick = clearCurrentSearch; createButton.onclick = () => openForm(); document.querySelector('#detail-back').onclick = () => { detailScreen.hidden = true; mode = 'list'; }; document.querySelector('#edit-product').onclick = () => { detailScreen.hidden = true; openForm(selectedId); }; document.querySelector('#form-back').onclick = requestFormClose; document.querySelector('#form-cancel').onclick = requestFormClose; document.querySelector('#form-submit').onclick = save; document.querySelector('#discard-cancel').onclick = () => { discardDialog.hidden = true; }; document.querySelector('#discard-confirm').onclick = () => { discardDialog.hidden = true; closeForm(); }; document.querySelector('#image-add').onclick = () => imageInput.click(); imageInput.onchange = () => addFiles(imageInput.files); document.querySelector('#image-remove-cancel').onclick = () => { imageRemoveDialog.hidden = true; }; document.querySelector('#image-remove-confirm').onclick = () => { const index = formImages.findIndex((image) => image.id === pendingRemovalImageId); if (index >= 0) { formImages.splice(index, 1); renderFormImages(); } imageRemoveDialog.hidden = true; }; document.querySelector('#preview-close').onclick = () => { document.querySelector('#image-preview').hidden = true; }; document.querySelector('#preview-previous').onclick = () => { carouselIndex--; const product = products.find((item) => item.id === selectedId); renderPreview(product); document.querySelector('#detail-images').innerHTML = renderDetailImages(product); bindCarousel(product); }; document.querySelector('#preview-next').onclick = () => { carouselIndex++; const product = products.find((item) => item.id === selectedId); renderPreview(product); document.querySelector('#detail-images').innerHTML = renderDetailImages(product); bindCarousel(product); }; document.querySelector('#show-loading').onclick = () => { listState = 'loading'; renderList(); }; document.querySelector('#show-empty').onclick = () => { listState = 'empty'; renderList(); }; document.querySelector('#show-error').onclick = () => { listState = 'error'; renderList(); }; document.querySelector('#reset-state').onclick = () => { listState = 'default'; renderList(); }; document.querySelector('#role-toggle').onclick = (event) => { role = role === 'editor' ? 'viewer' : 'editor'; event.currentTarget.textContent = role === 'viewer' ? '切换为编辑者' : '切换为查看者'; renderList(); if (!detailScreen.hidden) openDetail(selectedId); }; form.addEventListener('keydown', (event) => { if (event.key === 'Enter' && event.target.tagName !== 'TEXTAREA') { event.preventDefault(); save(); } }); renderList();
  </script>
</body>
