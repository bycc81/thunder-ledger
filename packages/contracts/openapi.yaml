openapi: 3.0.3
info:
  title: ThunderLedger API
  version: 0.1.0
paths:
  /api/healthz:
    get:
      responses:
        '200': { description: OK }
  /api/readyz:
    get:
      responses:
        '200': { description: Ready }
  /api/auth/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: Login successful }
        '401': { description: Invalid credentials }
